        updatedAtUtc: { type: string, format: date-time, nullable: true }
    TenantSettingValue:
      oneOf:
        - { type: boolean }
        - { $ref: '#/components/schemas/StoreProfileSetting' }
        - { $ref: '#/components/schemas/ReceiptTemplateSetting' }
        - { $ref: '#/components/schemas/ProductDisplaySetting' }
    StoreProfileSetting:
      type: object
      additionalProperties: false
      required: [storeName]
      properties:
        storeName: { type: string, minLength: 1 }
        address: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        taxCode: { type: string, nullable: true }
    ReceiptTemplateSetting:
      type: object
      additionalProperties: false
      required: [templateId]
      properties:
        templateId: { type: string, enum: [Standard] }
        showStoreAddress: { type: boolean }
        showTaxBreakdown: { type: boolean }
        footerText: { type: string, nullable: true, maxLength: 500 }
        layout: { $ref: '#/components/schemas/ReceiptLayout' }
    ReceiptLayout:
      type: object
      additionalProperties: false
      required: [version, paper, showSku, showUnit, blocks]
      description: Optional versioned print design. Absent layout uses the legacy Standard template. All amounts are invoice snapshots, never template defaults. Items and Total must each appear exactly once and remain enabled; other built-in types appear at most once.
      properties:
        version: { type: integer, enum: [1] }
        paper: { $ref: '#/components/schemas/ReceiptPaper' }
        showSku: { type: boolean }
        showUnit: { type: boolean }
        blocks:
          type: array
          minItems: 2
          maxItems: 40
          description: Ordered blocks with unique stable ids. At most 10 Service blocks. Enabled controls printing only, never invoice arithmetic.
          items:
            oneOf:
              - { $ref: '#/components/schemas/ReceiptBuiltInBlock' }
              - { $ref: '#/components/schemas/ReceiptTextBlock' }
              - { $ref: '#/components/schemas/ReceiptServiceBlock' }
    ReceiptPaper:
      type: object
      additionalProperties: false
      required: [preset, widthMm, heightMm, marginMm]
      description: Portrait A0 through A10 use ISO 216 dimensions. Roll58/80 require matching width and null height. Custom requires a finite height. Printable width and fixed height after both margins must each be at least 10 mm.
      properties:
        preset: { type: string, enum: [Roll58, Roll80, A0, A1, A2, A3, A4, A5, A6, A7, A8, A9, A10, Custom] }
        widthMm: { type: number, minimum: 25, maximum: 1500 }
        heightMm: { type: number, nullable: true, minimum: 25, maximum: 2000 }
        marginMm: { type: number, minimum: 0, maximum: 10 }
    ReceiptBuiltInBlock:
      type: object
      additionalProperties: false
      required: [id, type, enabled]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        type: { type: string, enum: [StoreName, StoreAddress, StorePhone, TaxCode, InvoiceNumber, DateTime, Cashier, Customer, Items, Discount, Tax, Total, Footer] }
        enabled: { type: boolean }
    ReceiptTextBlock:
      type: object
      additionalProperties: false
      required: [id, type, enabled, text, align]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        type: { type: string, enum: [Text] }
        enabled: { type: boolean }
        text: { type: string, minLength: 1, maxLength: 1000, description: Plain text only; whitespace-only is invalid. No HTML or executable placeholders. }
        align: { type: string, enum: [Left, Center, Right] }
    ReceiptServiceBlock:
      type: object
      additionalProperties: false
      required: [id, type, enabled, label, hideWhenZero]
      description: Service definition only; no amount or price may be stored in the template. Future invoice entry defaults each amount to 0, permits non-negative amounts and adds fees to the total; hiding a printed block must not remove incurred fees from arithmetic.
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        type: { type: string, enum: [Service] }
        enabled: { type: boolean }
        label: { type: string, minLength: 1, maxLength: 120 }
        hideWhenZero: { type: boolean, description: New editor defaults to true. }
    ProductDisplaySetting:
      type: object
      additionalProperties: false
      required: [layout]
      properties:
        layout: { type: string, enum: [Grid, List] }
        sortBy: { type: string, enum: [Name, Sku] }
        showSku: { type: boolean }
        showBarcode: { type: boolean }
        showCategory: { type: boolean }
    SyncInvoiceRequest:
      type: object
      additionalProperties: false
      required: [clientOperationId, payloadVersion, invoice]
      properties:
        clientOperationId: { type: string, format: uuid }
        payloadVersion: { type: integer, minimum: 1 }
        invoice: { $ref: '#/components/schemas/SaleInvoiceRequest' }
    SaleInvoiceRequest:
      type: object
      additionalProperties: false
      required: [id, invoiceType, currencyCode, totalAmount, details]
      properties:
        id: { type: string, format: uuid }
        invoiceNumber: { type: string, maxLength: 64 }
        invoiceType: { type: string, enum: [Sale] }
        customerId: { type: string, format: uuid, nullable: true }
        clientCreatedAtUtc: { type: string, format: date-time }
        currencyCode: { type: string, minLength: 3, maxLength: 3 }
        subtotal: { type: number, format: decimal }
        discountAmount: { type: number, format: decimal, minimum: 0 }
        taxAmount: { type: number, format: decimal, enum: [0], x-error-code: ERR_INVALID_FIELD }
        roundingAmount: { type: number, format: decimal }
        totalAmount: { type: number, format: decimal }
        details: { type: array, minItems: 1, items: { $ref: '#/components/schemas/SaleInvoiceDetailRequest' } }
    SaleInvoiceDetailRequest:
      type: object
      additionalProperties: false
      required: [lineNumber, productId, skuSnapshot, productNameSnapshot, unitSnapshot, quantity, unitPrice, discountAmount, taxRate, taxAmount, lineTotal]
      properties:
        lineNumber: { type: integer, minimum: 1 }
        productId: { type: string, format: uuid }
        skuSnapshot: { type: string, maxLength: 64 }
        productNameSnapshot: { type: string, maxLength: 200 }
        unitSnapshot: { type: string, maxLength: 32 }
        quantity: { type: number, format: decimal, minimum: 0, exclusiveMinimum: true, x-error-code: ERR_INVALID_QUANTITY }
        unitPrice: { type: number, format: decimal, minimum: 0, exclusiveMinimum: true, x-error-code: ERR_PRICE_MUST_BE_POSITIVE }
        discountAmount: { type: number, format: decimal, minimum: 0 }
        taxRate: { type: number, format: decimal, enum: [0], x-error-code: ERR_INVALID_FIELD }
        taxAmount: { type: number, format: decimal, enum: [0], x-error-code: ERR_INVALID_FIELD }
        lineTotal: { type: number, format: decimal }
    InvoiceStatus:
      type: string
      description: Business status of a server-persisted invoice. This is not the client's synchronization state.
      enum: [Active, Reversed]
    SyncStatus:
      type: string
      description: Client-local outbox state only; never returned or accepted by server API endpoints.
      enum: [Draft, Pending, Sending, Queued, Synced, Failed]
    Invoice:
      type: object
      required: [id, invoiceNumber, invoiceType, status, currencyCode, totalAmount, details]
      properties:
        id: { type: string, format: uuid }
        invoiceNumber: { type: string }
        invoiceType: { type: string, enum: [Sale, Reverse, Correction] }
        status: { $ref: '#/components/schemas/InvoiceStatus' }
        customerId: { type: string, format: uuid, nullable: true }
        createdByUserId: { type: string, format: uuid }
        deviceId: { type: string }
        clientCreatedAtUtc: { type: string, format: date-time }
        syncedAtUtc: { type: string, format: date-time, nullable: true }
        subtotal: { type: number, format: decimal }
        discountAmount: { type: number, format: decimal }
        taxAmount: { type: number, format: decimal }
        roundingAmount: { type: number, format: decimal }
        currencyCode: { type: string, minLength: 3, maxLength: 3 }
        totalAmount: { type: number, format: decimal }
        originalInvoiceId: { type: string, format: uuid, nullable: true }
        details:
          type: array
          items:
            type: object
            properties:
              lineNumber: { type: integer, nullable: true }
              productId: { type: string, format: uuid }
              skuSnapshot: { type: string, nullable: true }
              productNameSnapshot: { type: string }
              unitSnapshot: { type: string }
              quantity: { type: number, format: decimal }
              unitPrice: { type: number, format: decimal }
