openapi: 3.0.3
info:
  title: POS SaaS API
  version: 1.0.0
  description: Canonical API contract for ASP.NET Core backend and Flutter mobile.
servers:
  - url: https://api.example.com/api/v1
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Products
  - name: Customers
  - name: Invoices
  - name: Sync
  - name: Settings
  - name: Platform Administration
paths:
  /auth/login:
    post:
      operationId: login
      security: []
      tags: [Auth]
      parameters:
        - { name: X-Device-Id, in: header, required: false, schema: { type: string, maxLength: 160 } }
        - { name: X-Platform, in: header, required: false, schema: { type: string, maxLength: 32 } }
        - { name: X-App-Version, in: header, required: false, schema: { type: string, maxLength: 32 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Login success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessLoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/BusinessError' }
        '429': { description: Rate limited, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /auth/refresh:
    post:
      operationId: refreshToken
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessTokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { description: Rate limited, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      responses:
        '200': { description: Session revoked, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessLogoutResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /products:
    get:
      operationId: listProducts
      tags: [Products]
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Product collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessProductListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createProduct
      tags: [Products]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProductRequest' }
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessProductResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /products/{id}:
    patch:
      operationId: updateProduct
      tags: [Products]
      parameters:
        - { $ref: '#/components/parameters/ProductId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProductRequest' }
      responses:
        '200': { description: Product updated, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessProductResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /invoices/sync:
    post:
      operationId: syncInvoice
      tags: [Invoices]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/DeviceId' }
        - { $ref: '#/components/parameters/CorrelationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncInvoiceRequest' }
      responses:
        '201':
          description: Invoice applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessOperationResponse' }
        '200':
          description: Idempotent retry already applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessOperationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessError' }
  /sync/pull:
    get:
      operationId: pullChanges
      tags: [Sync]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Incremental changes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessSyncResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /categories:
    get:
      operationId: listCategories
      tags: [Products]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { description: Category collection, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessCategoryListResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createCategory
      tags: [Products]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCategoryRequest' }
      responses:
        '201': { description: Category created, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessCategoryResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /customers:
    get:
      operationId: listCustomers
      tags: [Customers]
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { description: Customer collection, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessCustomerListResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createCustomer
      tags: [Customers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCustomerRequest' }
      responses:
        '201': { description: Customer created, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessCustomerResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /customers/{id}:
    patch:
      operationId: updateCustomer
      tags: [Customers]
      parameters:
        - { $ref: '#/components/parameters/CustomerId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCustomerRequest' }
      responses:
        '200': { description: Customer updated, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessCustomerResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /categories/{id}:
    patch:
      operationId: updateCategory
      tags: [Products]
      parameters:
        - { $ref: '#/components/parameters/CategoryId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCategoryRequest' }
      responses:
        '200': { description: Category updated, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessCategoryResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /products/bulk-price:
    post:
      operationId: bulkUpdateProductPrices
      tags: [Products]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkPriceRequest' }
      responses:
        '200': { description: Bulk update result, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessOperationResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [Invoices]
      parameters:
        - { $ref: '#/components/parameters/InvoiceId' }
      responses:
        '200': { description: Invoice, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessInvoiceResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /invoices/{id}/reverse:
    post:
      operationId: reverseInvoice
      tags: [Invoices]
      parameters:
        - { $ref: '#/components/parameters/InvoiceId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/DeviceId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReverseInvoiceRequest' }
      responses:
        '201': { description: Reversal created, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessOperationResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessError' }
  /invoices/{id}/correction:
    post:
      operationId: correctInvoice
      tags: [Invoices]
      parameters:
        - { $ref: '#/components/parameters/InvoiceId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/DeviceId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CorrectionInvoiceRequest' }
      responses:
        '201': { description: Corrected invoice created, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessOperationResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /settings/effective:
    get:
      operationId: getEffectiveSettings
      tags: [Settings]
      responses:
        '200': { description: Effective settings, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessSettingsResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /settings/{key}:
    put:
      operationId: updateSetting
      tags: [Settings]
      parameters:
        - { name: key, in: path, required: true, schema: { type: string, maxLength: 120 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSettingRequest' }
      responses:
        '200': { description: Setting updated, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessSettingResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /platform/tenants/{tenantId}/admins:
    parameters:
      - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listTenantAdmins
      tags: [Platform Administration]
      description: SuperAdmin only. Lists TenantAdmin accounts in the specified tenant.
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { $ref: '#/components/parameters/PageSize' }
      x-error-codes: [ERR_ACCESS_DENIED, ERR_TENANT_NOT_FOUND, ERR_INVALID_PAGING]
      responses:
        '200': { description: TenantAdmin collection, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessTenantAdminListResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createTenantAdmin
      tags: [Platform Administration]
      description: SuperAdmin only. Creates a TenantAdmin account in the specified tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTenantAdminRequest' }
      x-error-codes: [ERR_ACCESS_DENIED, ERR_TENANT_NOT_FOUND, ERR_DUPLICATE_USERNAME, ERR_INVALID_REQUEST]
      responses:
        '201': { description: TenantAdmin created, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessTenantAdminResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /platform/tenants/{tenantId}/admins/{userId}:
    parameters:
      - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getTenantAdmin
      tags: [Platform Administration]
      description: SuperAdmin only. Reads an account scoped to the specified tenant.
      x-error-codes: [ERR_ACCESS_DENIED, ERR_TENANT_ADMIN_NOT_FOUND]
      responses:
        '200': { description: TenantAdmin account, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessTenantAdminResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateTenantAdmin
      tags: [Platform Administration]
      description: SuperAdmin only. Updates profile fields using optimistic concurrency.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTenantAdminRequest' }
      x-error-codes: [ERR_ACCESS_DENIED, ERR_TENANT_ADMIN_NOT_FOUND, ERR_DUPLICATE_USERNAME, ERR_VERSION_CONFLICT]
      responses:
        '200': { description: TenantAdmin updated, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessTenantAdminResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteTenantAdmin
      tags: [Platform Administration]
      description: SuperAdmin only. Permanently deletes only accounts without history or sessions.
      x-error-codes: [ERR_ACCESS_DENIED, ERR_TENANT_ADMIN_NOT_FOUND, ERR_TENANT_ADMIN_DELETE_REQUIRES_DEACTIVATION]
      responses:
        '200': { description: TenantAdmin deleted, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessDeletionResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /platform/tenants/{tenantId}/admins/{userId}/deactivate:
    post:
      operationId: deactivateTenantAdmin
      tags: [Platform Administration]
      description: SuperAdmin only. Deactivates the account and revokes all tenant-user sessions.
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      x-error-codes: [ERR_ACCESS_DENIED, ERR_TENANT_ADMIN_NOT_FOUND]
      responses:
        '200': { description: TenantAdmin deactivated, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessTenantAdminResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /platform/feature-flags:
    get:
      operationId: listGlobalFeatureFlags
      tags: [Platform Administration]
      description: SuperAdmin only. Lists global feature flags from the server registry.
      x-error-codes: [ERR_ACCESS_DENIED]
      responses:
        '200': { description: Global feature flag collection, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessFeatureFlagListResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /platform/feature-flags/{key}:
    put:
      operationId: updateGlobalFeatureFlag
      tags: [Platform Administration]
      description: SuperAdmin only. Updates one registered global boolean flag using optimistic concurrency.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string, maxLength: 120 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateGlobalFeatureFlagRequest' }
      x-error-codes: [ERR_ACCESS_DENIED, ERR_FEATURE_FLAG_NOT_FOUND, ERR_VERSION_CONFLICT, ERR_INVALID_REQUEST]
      responses:
        '200': { description: Global feature flag updated, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessFeatureFlagResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /config/version:
    get:
      operationId: getVersionConfig
      security: []
      tags: [Settings]
      responses:
        '200': { description: Version configuration, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessVersionResponse' } } } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Search: { name: search, in: query, required: false, schema: { type: string, maxLength: 120 } }
    Cursor: { name: cursor, in: query, required: false, schema: { type: string, nullable: true } }
    PageSize: { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    DeviceId: { name: X-Device-Id, in: header, required: true, schema: { type: string } }
    CorrelationId: { name: X-Correlation-Id, in: header, required: false, schema: { type: string, format: uuid } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
    InvoiceId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    ProductId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    CustomerId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    CategoryId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    BadRequest: { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Unauthorized: { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Forbidden: { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Conflict: { description: Conflict, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    BusinessError: { description: Business rule rejection, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    NotFound: { description: Resource not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  schemas:
    Meta:
      type: object
      required: [correlationId, serverTimeUtc, apiVersion]
      properties:
        correlationId: { type: string, format: uuid }
        serverTimeUtc: { type: string, format: date-time }
        apiVersion: { type: string, example: v1 }
        paging: { $ref: '#/components/schemas/Paging' }
    Paging:
      type: object
      required: [hasMore, pageSize]
      properties:
        nextCursor: { type: string, nullable: true }
        hasMore: { type: boolean }
        pageSize: { type: integer, minimum: 1, maximum: 200 }
    ErrorResponse:
      type: object
      required: [data, error, meta]
      properties:
        data: { type: object, nullable: true }
        error:
          type: object
          required: [code, args, fieldErrors, retryable]
          properties:
            code: { type: string, example: ERR_PRODUCT_NOT_FOUND }
            args: { type: object, additionalProperties: true }
            fieldErrors: { type: array, items: { $ref: '#/components/schemas/FieldError' } }
            retryable: { type: boolean }
        meta: { $ref: '#/components/schemas/Meta' }
    FieldError:
      type: object
      required: [field, code, args]
      properties:
        field: { type: string }
        code: { type: string }
        args: { type: object, additionalProperties: true }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 120 }
        password: { type: string, format: password }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, format: password }
    CreateProductRequest:
      type: object
      required: [sku, name, unit, basePrice, taxRate]
      properties:
        sku: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
        unit: { type: string, maxLength: 32 }
        basePrice: { type: number, format: decimal, minimum: 0 }
        taxRate: { type: number, format: decimal, minimum: 0 }
        categoryId: { type: string, format: uuid, nullable: true }
    UpdateProductRequest:
      type: object
      required: [expectedVersion]
      properties:
        name: { type: string, maxLength: 200 }
        unit: { type: string, maxLength: 32 }
        basePrice: { type: number, format: decimal, minimum: 0 }
        taxRate: { type: number, format: decimal, minimum: 0 }
        categoryId: { type: string, format: uuid, nullable: true }
        expectedVersion: { type: integer, format: int64 }
    CreateCategoryRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 160 }
        parentId: { type: string, format: uuid, nullable: true }
    UpdateCategoryRequest:
      type: object
      required: [expectedVersion]
      properties:
        name: { type: string, maxLength: 160 }
        parentId: { type: string, format: uuid, nullable: true }
        expectedVersion: { type: integer, format: int64 }
    CreateCustomerRequest:
      type: object
      required: [code, fullName]
      properties:
        code: { type: string, maxLength: 64 }
        fullName: { type: string, maxLength: 160 }
        phone: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        address: { type: string, nullable: true }
    UpdateCustomerRequest:
      type: object
      required: [expectedVersion]
      properties:
        fullName: { type: string, maxLength: 160 }
        phone: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        address: { type: string, nullable: true }
