openapi: 3.0.3
info:
  title: POS SaaS API
  version: 1.0.0
  description: Canonical API contract for ASP.NET Core backend and Flutter mobile.
servers:
  - url: https://api.example.com/api/v1
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Products
  - name: Customers
  - name: Invoices
  - name: Sync
  - name: Settings
  - name: Platform Administration
paths:
  /auth/login:
    post:
      operationId: login
      security: []
      tags: [Auth]
      parameters:
        - { name: X-Device-Id, in: header, required: false, schema: { type: string, maxLength: 160 } }
        - { name: X-Platform, in: header, required: false, schema: { type: string, maxLength: 32 } }
        - { name: X-App-Version, in: header, required: false, schema: { type: string, maxLength: 32 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Login success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessLoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/BusinessError' }
        '429': { description: Rate limited, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /auth/refresh:
    post:
      operationId: refreshToken
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessTokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { description: Rate limited, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      responses:
        '200': { description: Session revoked, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessLogoutResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /products:
    get:
      operationId: listProducts
      tags: [Products]
      description: Staff and TenantAdmin may search products in their tenant. Staff only see active products; includeInactive is TenantAdmin-only.
      x-error-codes: [ERR_ACCESS_DENIED, ERR_INVALID_FIELD, ERR_INVALID_PAGING]
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: updatedSince, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: includeInactive, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Product collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessProductListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createProduct
      tags: [Products]
      summary: Queue product creation
      x-error-codes: [ERR_ACCESS_DENIED, ERR_REQUIRED_FIELD, ERR_UNKNOWN_FIELD, ERR_INVALID_FIELD, ERR_INVALID_UUID, ERR_INVALID_DECIMAL, ERR_PRICE_MUST_BE_POSITIVE, ERR_DUPLICATE_SKU, ERR_DUPLICATE_BARCODE]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProductRequest' }
      responses:
        '202':
          description: Product creation queued; completion is broadcast after commit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessQueuedCommandResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /products/{id}:
    patch:
      operationId: updateProduct
      tags: [Products]
      x-error-codes: [ERR_ACCESS_DENIED, ERR_REQUIRED_FIELD, ERR_UNKNOWN_FIELD, ERR_INVALID_FIELD, ERR_INVALID_UUID, ERR_INVALID_DECIMAL, ERR_PRICE_MUST_BE_POSITIVE, ERR_VERSION_CONFLICT]
      parameters:
        - { $ref: '#/components/parameters/ProductId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProductRequest' }
      responses:
        '200': { description: Product updated, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessProductResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessError' }
  /invoices/sync:
    post:
      operationId: syncInvoice
      tags: [Invoices]
      summary: Queue invoice synchronization
      description: Staff and TenantAdmin may create and sync Sale invoices within their tenant.
      x-error-codes: [ERR_ACCESS_DENIED, ERR_REQUIRED_FIELD, ERR_UNKNOWN_FIELD, ERR_INVALID_FIELD, ERR_INVALID_UUID, ERR_INVALID_ENUM, ERR_INVALID_DECIMAL, ERR_INVALID_QUANTITY, ERR_PRICE_MUST_BE_POSITIVE, ERR_PRODUCT_NOT_FOUND, ERR_PRODUCT_INACTIVE, ERR_CUSTOMER_NOT_FOUND, ERR_CUSTOMER_INACTIVE, ERR_CUSTOMER_PHONE_REQUIRED, ERR_INVOICE_TOTAL_INVALID, ERR_SYNC_PAYLOAD_MISMATCH, ERR_IDEMPOTENCY_KEY_MISMATCH, ERR_UNSUPPORTED_PAYLOAD_VERSION]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CorrelationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncInvoiceRequest' }
      responses:
        '202':
          description: Invoice sync queued; completion is broadcast after commit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessQueuedCommandResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /sync/pull:
    get:
      operationId: pullChanges
      tags: [Sync]
      summary: Pull changes after a server sequence
      parameters:
        - { name: afterSequence, in: query, required: false, schema: { type: integer, format: int64, minimum: 0, default: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Incremental changes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessSyncResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /categories:
    get:
      operationId: listCategories
      tags: [Products]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { description: Category collection, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessCategoryListResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createCategory
      tags: [Products]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCategoryRequest' }
      responses:
        '201': { description: Category created, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessCategoryResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /customers:
    get:
      operationId: listCustomers
      tags: [Customers]
      description: Staff and TenantAdmin may search customers in their tenant. Staff only see active customers; includeInactive is TenantAdmin-only.
      x-error-codes: [ERR_ACCESS_DENIED, ERR_INVALID_FIELD, ERR_INVALID_PAGING]
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: updatedSince, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: includeInactive, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200': { description: Customer collection, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessCustomerListResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createCustomer
      tags: [Customers]
      summary: Queue customer creation
      description: TenantAdmin only. Creates a customer in the authenticated tenant.
      x-error-codes: [ERR_ACCESS_DENIED, ERR_INVALID_REQUEST, ERR_DUPLICATE_CUSTOMER_CODE]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCustomerRequest' }
      responses:
        '202': { description: Customer creation queued; completion is broadcast after commit, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessQueuedCommandResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /customers/{id}:
    patch:
      operationId: updateCustomer
      tags: [Customers]
      description: TenantAdmin only. Updates customer profile fields; tenant and active state cannot be changed here.
      x-error-codes: [ERR_ACCESS_DENIED, ERR_CUSTOMER_NOT_FOUND, ERR_VERSION_CONFLICT]
      parameters:
        - { $ref: '#/components/parameters/CustomerId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCustomerRequest' }
      responses:
        '200': { description: Customer updated, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessCustomerResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteCustomer
      tags: [Customers]
      description: TenantAdmin only. Hard-deletes only a customer with no invoice/history references; otherwise deactivate the customer.
      x-error-codes: [ERR_ACCESS_DENIED, ERR_CUSTOMER_NOT_FOUND, ERR_CUSTOMER_DELETE_REQUIRES_DEACTIVATION, ERR_VERSION_CONFLICT]
      parameters:
        - { $ref: '#/components/parameters/CustomerId' }
        - { name: expectedVersion, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200': { description: Customer deleted, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessDeletionResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /customers/{id}/deactivate:
    post:
      operationId: deactivateCustomer
      tags: [Customers]
      description: TenantAdmin only. Deactivates the customer while preserving invoice references and audit history.
      x-error-codes: [ERR_ACCESS_DENIED, ERR_CUSTOMER_NOT_FOUND, ERR_VERSION_CONFLICT]
      parameters:
        - { $ref: '#/components/parameters/CustomerId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeactivateCustomerRequest' }
      responses:
        '200': { description: Customer deactivated, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessCustomerResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /categories/{id}:
    patch:
      operationId: updateCategory
      tags: [Products]
      parameters:
        - { $ref: '#/components/parameters/CategoryId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCategoryRequest' }
      responses:
        '200': { description: Category updated, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessCategoryResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /products/bulk-price:
    post:
      operationId: bulkUpdateProductPrices
      tags: [Products]
      x-error-codes: [ERR_ACCESS_DENIED, ERR_REQUIRED_FIELD, ERR_UNKNOWN_FIELD, ERR_INVALID_FIELD, ERR_INVALID_UUID, ERR_INVALID_ENUM, ERR_INVALID_DECIMAL, ERR_PRICE_ADJUSTMENT_MUST_BE_POSITIVE, ERR_PRICE_MUST_BE_POSITIVE, ERR_VERSION_CONFLICT]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkPriceRequest' }
      responses:
        '200': { description: Bulk update result, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessOperationResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessError' }
  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [Invoices]
      parameters:
        - { $ref: '#/components/parameters/InvoiceId' }
      responses:
        '200': { description: Invoice, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessInvoiceResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /invoices/{id}/reverse:
    post:
      operationId: reverseInvoice
      tags: [Invoices]
      description: TenantAdmin only. Creates an immutable reversal; Staff cannot reverse invoices, with or without an Admin PIN.
      x-error-codes: [ERR_ACCESS_DENIED, ERR_INVALID_REQUEST, ERR_INVOICE_NOT_FOUND, ERR_INVOICE_ALREADY_REVERSED, ERR_INVOICE_IMMUTABLE]
      parameters:
        - { $ref: '#/components/parameters/InvoiceId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/DeviceId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReverseInvoiceRequest' }
      responses:
        '201': { description: Reversal created, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessOperationResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessError' }
  /invoices/{id}/correction:
    post:
      operationId: correctInvoice
      tags: [Invoices]
      description: TenantAdmin only. Reverses the original invoice and creates a new correction invoice without mutating the original.
      x-error-codes: [ERR_ACCESS_DENIED, ERR_INVOICE_NOT_FOUND, ERR_INVOICE_ALREADY_REVERSED, ERR_INVOICE_TOTAL_INVALID]
      parameters:
        - { $ref: '#/components/parameters/InvoiceId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/DeviceId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CorrectionInvoiceRequest' }
      responses:
        '201': { description: Corrected invoice created, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessOperationResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessError' }
  /settings/effective:
    get:
      operationId: getEffectiveSettings
      tags: [Settings]
      responses:
        '200': { description: Effective settings, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessSettingsResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /settings/{key}:
    put:
      operationId: updateSetting
      tags: [Settings]
      parameters:
        - { name: key, in: path, required: true, schema: { type: string, maxLength: 120 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSettingRequest' }
      responses:
        '200': { description: Setting updated, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessSettingResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /platform/tenants:
    get:
      operationId: listPlatformTenants
      tags: [Platform Administration]
      description: SuperAdmin only. Lists tenants; deleted tenants are excluded unless includeDeleted is true.
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: includeDeleted, in: query, required: false, schema: { type: boolean, default: false } }
      x-error-codes: [ERR_ACCESS_DENIED, ERR_INVALID_PAGING]
      responses:
        '200': { description: Tenant collection, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessPlatformTenantListResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createPlatformTenant
      tags: [Platform Administration]
      description: SuperAdmin only. Creates a tenant and its first TenantAdmin atomically.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePlatformTenantRequest' }
      x-error-codes: [ERR_ACCESS_DENIED, ERR_DUPLICATE_TENANT_CODE, ERR_INVALID_REQUEST]
      responses:
        '201': { description: Tenant and initial TenantAdmin created, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessCreatePlatformTenantResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /platform/tenants/{tenantId}:
    parameters:
      - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getPlatformTenant
      tags: [Platform Administration]
      description: SuperAdmin only. Reads a tenant, including deleted tenants only when explicitly requested.
      parameters:
        - { name: includeDeleted, in: query, required: false, schema: { type: boolean, default: false } }
      x-error-codes: [ERR_ACCESS_DENIED, ERR_TENANT_NOT_FOUND]
      responses:
        '200': { description: Tenant, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessPlatformTenantResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updatePlatformTenant
      tags: [Platform Administration]
      description: SuperAdmin only. Updates tenant profile using optimistic concurrency.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePlatformTenantRequest' }
      x-error-codes: [ERR_ACCESS_DENIED, ERR_TENANT_NOT_FOUND, ERR_DUPLICATE_TENANT_CODE, ERR_VERSION_CONFLICT]
      responses:
        '200': { description: Tenant updated, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessPlatformTenantResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deletePlatformTenant
      tags: [Platform Administration]
      description: SuperAdmin only. Soft-deletes and closes the tenant, revoking all tenant sessions without deleting business data.
      x-error-codes: [ERR_ACCESS_DENIED, ERR_TENANT_NOT_FOUND]
      responses:
        '200': { description: Tenant soft-deleted, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessDeletePlatformTenantResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /platform/tenants/{tenantId}/suspend:
    post:
      operationId: suspendPlatformTenant
      tags: [Platform Administration]
      description: SuperAdmin only. Suspends the tenant and revokes all existing tenant sessions.
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      x-error-codes: [ERR_ACCESS_DENIED, ERR_TENANT_NOT_FOUND]
      responses:
        '200': { description: Tenant suspended, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessPlatformTenantResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /platform/tenants/{tenantId}/reactivate:
    post:
      operationId: reactivatePlatformTenant
      tags: [Platform Administration]
      description: SuperAdmin only. Reactivates a suspended tenant; revoked users must sign in again.
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      x-error-codes: [ERR_ACCESS_DENIED, ERR_TENANT_NOT_FOUND]
      responses:
        '200': { description: Tenant reactivated, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessPlatformTenantResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /platform/tenants/{tenantId}/admins:
    parameters:
      - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listTenantAdmins
      tags: [Platform Administration]
      description: SuperAdmin only. Lists TenantAdmin accounts in the specified tenant.
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { $ref: '#/components/parameters/PageSize' }
      x-error-codes: [ERR_ACCESS_DENIED, ERR_TENANT_NOT_FOUND, ERR_INVALID_PAGING]
      responses:
        '200': { description: TenantAdmin collection, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessTenantAdminListResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createTenantAdmin
      tags: [Platform Administration]
      description: SuperAdmin only. Creates a TenantAdmin account in the specified tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTenantAdminRequest' }
      x-error-codes: [ERR_ACCESS_DENIED, ERR_TENANT_NOT_FOUND, ERR_DUPLICATE_USERNAME, ERR_INVALID_REQUEST]
      responses:
        '201': { description: TenantAdmin created, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessTenantAdminResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /platform/tenants/{tenantId}/admins/{userId}:
    parameters:
      - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getTenantAdmin
      tags: [Platform Administration]
      description: SuperAdmin only. Reads an account scoped to the specified tenant.
      x-error-codes: [ERR_ACCESS_DENIED, ERR_TENANT_ADMIN_NOT_FOUND]
      responses:
        '200': { description: TenantAdmin account, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessTenantAdminResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateTenantAdmin
      tags: [Platform Administration]
      description: SuperAdmin only. Updates profile fields using optimistic concurrency.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTenantAdminRequest' }
      x-error-codes: [ERR_ACCESS_DENIED, ERR_TENANT_ADMIN_NOT_FOUND, ERR_DUPLICATE_USERNAME, ERR_VERSION_CONFLICT]
      responses:
        '200': { description: TenantAdmin updated, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessTenantAdminResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteTenantAdmin
      tags: [Platform Administration]
      description: SuperAdmin only. Permanently deletes only accounts without history or sessions.
      x-error-codes: [ERR_ACCESS_DENIED, ERR_TENANT_ADMIN_NOT_FOUND, ERR_TENANT_ADMIN_DELETE_REQUIRES_DEACTIVATION]
      responses:
        '200': { description: TenantAdmin deleted, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessDeletionResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /platform/tenants/{tenantId}/admins/{userId}/deactivate:
    post:
      operationId: deactivateTenantAdmin
      tags: [Platform Administration]
      description: SuperAdmin only. Deactivates the account and revokes all tenant-user sessions.
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      x-error-codes: [ERR_ACCESS_DENIED, ERR_TENANT_ADMIN_NOT_FOUND]
      responses:
        '200': { description: TenantAdmin deactivated, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessTenantAdminResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /platform/feature-flags:
    get:
      operationId: listGlobalFeatureFlags
      tags: [Platform Administration]
      description: SuperAdmin only. Lists global feature flags from the server registry.
      x-error-codes: [ERR_ACCESS_DENIED]
      responses:
        '200': { description: Global feature flag collection, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessFeatureFlagListResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /platform/feature-flags/{key}:
    put:
      operationId: updateGlobalFeatureFlag
      tags: [Platform Administration]
      description: SuperAdmin only. Updates one registered global boolean flag using optimistic concurrency.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string, maxLength: 120 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateGlobalFeatureFlagRequest' }
      x-error-codes: [ERR_ACCESS_DENIED, ERR_FEATURE_FLAG_NOT_FOUND, ERR_VERSION_CONFLICT, ERR_INVALID_REQUEST]
      responses:
        '200': { description: Global feature flag updated, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessFeatureFlagResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /config/version:
    get:
      operationId: getVersionConfig
      security: []
      tags: [Settings]
      responses:
        '200': { description: Version configuration, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessVersionResponse' } } } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Search: { name: search, in: query, required: false, schema: { type: string, maxLength: 120 } }
    Cursor: { name: cursor, in: query, required: false, schema: { type: string, nullable: true } }
    PageSize: { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    DeviceId: { name: X-Device-Id, in: header, required: true, schema: { type: string } }
    CorrelationId: { name: X-Correlation-Id, in: header, required: false, schema: { type: string, format: uuid } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
    InvoiceId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    ProductId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    CustomerId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    CategoryId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    BadRequest: { description: 'Invalid request. Codes include ERR_INVALID_REQUEST, ERR_REQUIRED_FIELD, ERR_UNKNOWN_FIELD, ERR_INVALID_FIELD, ERR_INVALID_UUID, ERR_INVALID_EMAIL, ERR_INVALID_TIME_ZONE, ERR_INVALID_ENUM, ERR_INVALID_DECIMAL and ERR_INVALID_PAGING.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Unauthorized: { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Forbidden: { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Conflict: { description: Conflict, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    BusinessError: { description: Business rule rejection, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    NotFound: { description: Resource not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    ServiceUnavailable: { description: RabbitMQ or required dependency is unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  schemas:
    Meta:
      type: object
      required: [correlationId, serverTimeUtc, apiVersion]
      properties:
        correlationId: { type: string, format: uuid }
        serverTimeUtc: { type: string, format: date-time }
        apiVersion: { type: string, example: v1 }
        paging: { $ref: '#/components/schemas/Paging' }
    Paging:
      type: object
      required: [hasMore]
      properties:
        nextCursor: { type: string, nullable: true }
        nextSequence: { type: integer, format: int64, minimum: 0 }
        hasMore: { type: boolean }
        pageSize: { type: integer, minimum: 1, maximum: 200 }
        limit: { type: integer, minimum: 1, maximum: 200 }
    ErrorResponse:
      type: object
      required: [data, error, meta]
      properties:
        data: { type: object, nullable: true }
        error:
          type: object
          required: [code, args, fieldErrors, retryable]
          properties:
            code: { type: string, example: ERR_PRODUCT_NOT_FOUND }
            args: { type: object, additionalProperties: true }
            fieldErrors: { type: array, items: { $ref: '#/components/schemas/FieldError' } }
            retryable: { type: boolean }
        meta: { $ref: '#/components/schemas/Meta' }
    FieldError:
      type: object
      required: [field, code, args]
      properties:
        field: { type: string }
        code: { type: string }
        args: { type: object, additionalProperties: true }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, maxLength: 120 }
        password: { type: string, format: password }
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string, format: password }
    CreateProductRequest:
      type: object
      additionalProperties: false
      required: [sku, name, unit, basePrice, taxRate]
      properties:
        sku: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 200 }
        unit: { type: string, minLength: 1, maxLength: 32 }
        basePrice: { type: number, format: decimal, minimum: 0, exclusiveMinimum: true, x-error-code: ERR_PRICE_MUST_BE_POSITIVE }
        taxRate: { type: number, format: decimal, enum: [0], x-error-code: ERR_INVALID_FIELD }
        categoryId: { type: string, format: uuid, nullable: true }
    UpdateProductRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        unit: { type: string, minLength: 1, maxLength: 32 }
        basePrice: { type: number, format: decimal, minimum: 0, exclusiveMinimum: true, x-error-code: ERR_PRICE_MUST_BE_POSITIVE }
        taxRate: { type: number, format: decimal, enum: [0], x-error-code: ERR_INVALID_FIELD }
        categoryId: { type: string, format: uuid, nullable: true }
        expectedVersion: { type: integer, format: int64, minimum: 1 }
    CreateCategoryRequest:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 160 }
        parentId: { type: string, format: uuid, nullable: true }
    UpdateCategoryRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        parentId: { type: string, format: uuid, nullable: true }
        expectedVersion: { type: integer, format: int64, minimum: 1 }
    CreateCustomerRequest:
      type: object
      additionalProperties: false
      required: [code, fullName]
      properties:
        code: { type: string, minLength: 1, maxLength: 64 }
        fullName: { type: string, minLength: 1, maxLength: 160 }
        phone: { type: string, maxLength: 32, nullable: true }
        email: { type: string, format: email, maxLength: 254, nullable: true }
        address: { type: string, maxLength: 500, nullable: true }
    UpdateCustomerRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 160 }
        phone: { type: string, maxLength: 32, nullable: true }
        email: { type: string, format: email, maxLength: 254, nullable: true }
        address: { type: string, maxLength: 500, nullable: true }
        expectedVersion: { type: integer, format: int64, minimum: 1 }
    DeactivateCustomerRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 1 }
    BulkPriceRequest:
      type: object
      additionalProperties: false
      required: [productIds, operation, mode, value]
      properties:
        productIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
        operation: { type: string, enum: [Increase, Decrease], x-error-code: ERR_INVALID_ENUM }
        mode: { type: string, enum: [Percentage, FixedAmount], x-error-code: ERR_INVALID_ENUM }
        value: { type: number, format: decimal, minimum: 0, exclusiveMinimum: true, x-error-code: ERR_PRICE_ADJUSTMENT_MUST_BE_POSITIVE }
        expectedVersions: { type: object, additionalProperties: { type: integer, format: int64 } }
    ReverseInvoiceRequest:
      type: object
      additionalProperties: false
      required: [reasonCode]
      properties:
        reasonCode: { type: string, minLength: 1, maxLength: 80 }
    CorrectionInvoiceRequest:
      type: object
      additionalProperties: false
      required: [reasonCode, details]
      properties:
        reasonCode: { type: string, maxLength: 80 }
        details: { type: array, minItems: 1, items: { $ref: '#/components/schemas/SaleInvoiceDetailRequest' } }
    UpdateSettingRequest:
      type: object
      additionalProperties: false
      required: [value, expectedVersion]
      properties:
        value: { $ref: '#/components/schemas/TenantSettingValue' }
        expectedVersion: { type: integer, format: int64 }
    TenantSettingValue:
      oneOf:
        - { type: boolean }
        - { $ref: '#/components/schemas/StoreProfileSetting' }
        - { $ref: '#/components/schemas/ReceiptTemplateSetting' }
        - { $ref: '#/components/schemas/ProductDisplaySetting' }
    StoreProfileSetting:
      type: object
      additionalProperties: false
      required: [storeName]
      properties:
        storeName: { type: string, minLength: 1 }
        address: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        taxCode: { type: string, nullable: true }
    ReceiptTemplateSetting:
      type: object
      additionalProperties: false
      required: [templateId]
      properties:
        templateId: { type: string, minLength: 1 }
        showStoreAddress: { type: boolean }
        showTaxBreakdown: { type: boolean }
        footerText: { type: string, nullable: true }
    ProductDisplaySetting:
      type: object
      additionalProperties: false
      required: [layout]
      properties:
        layout: { type: string, enum: [Grid, List] }
        sortBy: { type: string, enum: [Name, Sku] }
        showSku: { type: boolean }
        showBarcode: { type: boolean }
        showCategory: { type: boolean }
    SyncInvoiceRequest:
      type: object
      additionalProperties: false
      required: [clientOperationId, payloadVersion, invoice]
      properties:
        clientOperationId: { type: string, format: uuid }
        payloadVersion: { type: integer, minimum: 1 }
        invoice: { $ref: '#/components/schemas/SaleInvoiceRequest' }
    SaleInvoiceRequest:
      type: object
      additionalProperties: false
      required: [id, invoiceType, currencyCode, totalAmount, details]
      properties:
        id: { type: string, format: uuid }
        invoiceNumber: { type: string, maxLength: 64 }
        invoiceType: { type: string, enum: [Sale] }
        customerId: { type: string, format: uuid, nullable: true }
        clientCreatedAtUtc: { type: string, format: date-time }
        currencyCode: { type: string, minLength: 3, maxLength: 3 }
        subtotal: { type: number, format: decimal }
        discountAmount: { type: number, format: decimal, minimum: 0 }
        taxAmount: { type: number, format: decimal, enum: [0], x-error-code: ERR_INVALID_FIELD }
        roundingAmount: { type: number, format: decimal }
        totalAmount: { type: number, format: decimal }
        details: { type: array, minItems: 1, items: { $ref: '#/components/schemas/SaleInvoiceDetailRequest' } }
    SaleInvoiceDetailRequest:
      type: object
      additionalProperties: false
      required: [lineNumber, productId, skuSnapshot, productNameSnapshot, unitSnapshot, quantity, unitPrice, discountAmount, taxRate, taxAmount, lineTotal]
      properties:
        lineNumber: { type: integer, minimum: 1 }
        productId: { type: string, format: uuid }
        skuSnapshot: { type: string, maxLength: 64 }
        productNameSnapshot: { type: string, maxLength: 200 }
        unitSnapshot: { type: string, maxLength: 32 }
        quantity: { type: number, format: decimal, minimum: 0, exclusiveMinimum: true, x-error-code: ERR_INVALID_QUANTITY }
        unitPrice: { type: number, format: decimal, minimum: 0, exclusiveMinimum: true, x-error-code: ERR_PRICE_MUST_BE_POSITIVE }
        discountAmount: { type: number, format: decimal, minimum: 0 }
        taxRate: { type: number, format: decimal, enum: [0], x-error-code: ERR_INVALID_FIELD }
        taxAmount: { type: number, format: decimal, enum: [0], x-error-code: ERR_INVALID_FIELD }
        lineTotal: { type: number, format: decimal }
    Invoice:
      type: object
      required: [id, invoiceNumber, invoiceType, status, currencyCode, totalAmount, details]
      properties:
        id: { type: string, format: uuid }
        invoiceNumber: { type: string }
        invoiceType: { type: string, enum: [Sale, Reverse, Correction] }
        status: { type: string }
        customerId: { type: string, format: uuid, nullable: true }
        createdByUserId: { type: string, format: uuid }
        deviceId: { type: string }
        clientCreatedAtUtc: { type: string, format: date-time }
        syncedAtUtc: { type: string, format: date-time, nullable: true }
        subtotal: { type: number, format: decimal }
        discountAmount: { type: number, format: decimal }
        taxAmount: { type: number, format: decimal }
        roundingAmount: { type: number, format: decimal }
        currencyCode: { type: string, minLength: 3, maxLength: 3 }
        totalAmount: { type: number, format: decimal }
        originalInvoiceId: { type: string, format: uuid, nullable: true }
        details:
          type: array
          items:
            type: object
            properties:
              lineNumber: { type: integer, nullable: true }
              productId: { type: string, format: uuid }
              skuSnapshot: { type: string, nullable: true }
              productNameSnapshot: { type: string }
              unitSnapshot: { type: string }
              quantity: { type: number, format: decimal }
              unitPrice: { type: number, format: decimal }
              discountAmount: { type: number, format: decimal }
              taxRate: { type: number, format: decimal }
              taxAmount: { type: number, format: decimal }
              lineTotal: { type: number, format: decimal }
    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        barcode: { type: string, nullable: true }
        name: { type: string }
        unit: { type: string }
        basePrice: { type: number, format: decimal }
        taxRate: { type: number, format: decimal }
        version: { type: integer, format: int64 }
        updatedAtUtc: { type: string, format: date-time }
    Category:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        parentId: { type: string, format: uuid, nullable: true }
    Customer:
      type: object
      required: [id, code, fullName, isActive, updatedAtUtc]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, maxLength: 64 }
        fullName: { type: string, maxLength: 160 }
        phone: { type: string, maxLength: 32, nullable: true }
        isActive: { type: boolean }
        updatedAtUtc: { type: string, format: date-time }
    PlatformTenant:
      type: object
      required: [id, code, name, status, timeZone, currencyCode, isDeleted, version, createdAtUtc]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, maxLength: 32 }
        name: { type: string, maxLength: 160 }
        status: { type: string, enum: [Active, Suspended, Closed] }
        timeZone: { type: string, maxLength: 64 }
        currencyCode: { type: string, minLength: 3, maxLength: 3 }
        isDeleted: { type: boolean }
        version: { type: integer, format: int64 }
        createdAtUtc: { type: string, format: date-time }
        updatedAtUtc: { type: string, format: date-time, nullable: true }
    CreatePlatformTenantRequest:
      type: object
      additionalProperties: false
      required: [code, name, timeZone, currencyCode, tenantAdmin]
      properties:
        code: { type: string, minLength: 1, maxLength: 32 }
        name: { type: string, minLength: 1, maxLength: 160 }
        timeZone: { type: string, minLength: 1, maxLength: 64 }
        currencyCode: { type: string, pattern: '^[A-Za-z]{3}$' }
        tenantAdmin:
          type: object
          additionalProperties: false
          required: [username, initialPassword, displayName]
          properties:
            username: { type: string, minLength: 1, maxLength: 120 }
            initialPassword: { type: string, format: password, minLength: 12, maxLength: 128 }
            displayName: { type: string, minLength: 1, maxLength: 160 }
            email: { type: string, format: email, maxLength: 254, nullable: true }
            phone: { type: string, maxLength: 32, nullable: true }
    UpdatePlatformTenantRequest:
      type: object
      additionalProperties: false
      required: [code, name, timeZone, currencyCode, expectedVersion]
      properties:
        code: { type: string, minLength: 1, maxLength: 32 }
        name: { type: string, minLength: 1, maxLength: 160 }
        timeZone: { type: string, minLength: 1, maxLength: 64 }
        currencyCode: { type: string, pattern: '^[A-Za-z]{3}$' }
        expectedVersion: { type: integer, format: int64, minimum: 1 }
    CreatePlatformTenantResponse:
      type: object
      required: [tenant, tenantAdmin]
      properties:
        tenant: { $ref: '#/components/schemas/PlatformTenant' }
        tenantAdmin: { $ref: '#/components/schemas/TenantAdminAccount' }
    DeletePlatformTenantResponse:
      type: object
      required: [id, deleted]
      properties:
        id: { type: string, format: uuid }
        deleted: { type: boolean }
    TenantAdminAccount:
      type: object
      required: [id, tenantId, username, displayName, status, version, createdAtUtc]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        username: { type: string, maxLength: 120 }
        displayName: { type: string, maxLength: 160 }
        email: { type: string, format: email, maxLength: 254, nullable: true }
        phone: { type: string, maxLength: 32, nullable: true }
        status: { type: string, enum: [Active, Inactive] }
        version: { type: integer, format: int64 }
        createdAtUtc: { type: string, format: date-time }
        updatedAtUtc: { type: string, format: date-time, nullable: true }
    CreateTenantAdminRequest:
      type: object
      additionalProperties: false
      required: [username, initialPassword, displayName]
      properties:
        username: { type: string, minLength: 1, maxLength: 120 }
        initialPassword: { type: string, format: password, minLength: 12, maxLength: 128 }
        displayName: { type: string, minLength: 1, maxLength: 160 }
        email: { type: string, format: email, maxLength: 254, nullable: true }
        phone: { type: string, maxLength: 32, nullable: true }
    UpdateTenantAdminRequest:
      type: object
      additionalProperties: false
      required: [username, displayName, expectedVersion]
      properties:
        username: { type: string, minLength: 1, maxLength: 120 }
        displayName: { type: string, minLength: 1, maxLength: 160 }
        email: { type: string, format: email, maxLength: 254, nullable: true }
        phone: { type: string, maxLength: 32, nullable: true }
        expectedVersion: { type: integer, format: int64, minimum: 1 }
    GlobalFeatureFlag:
      type: object
      required: [key, value, scope, version]
      properties:
        key: { type: string, maxLength: 120 }
        value: { type: boolean }
        scope: { type: string, enum: [Global] }
        version: { type: integer, format: int64 }
        updatedAtUtc: { type: string, format: date-time, nullable: true }
    UpdateGlobalFeatureFlagRequest:
      type: object
      additionalProperties: false
      required: [value, expectedVersion]
      properties:
        value: { type: boolean }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    DeletionResult:
      type: object
      required: [id, deleted]
      properties:
        id: { type: string, format: uuid }
        deleted: { type: boolean }
    Setting:
      type: object
      properties:
        key: { type: string }
